<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1>Add a New Book</h1>
    <form th:action="@{/books}" th:object="${book}" method="post">
        <label for="title">Title:</label>
        <input type="text" id="title" th:field="*{title}" required>
        <br>
        <label for="author">Author:</label>
        <input type="text" id="author" th:field="*{author}" required>
        <br>
        <label for="year">Year:</label>
        <input type="number" id="year" th:field="*{year}" required>
        <br>
        <label for="isbn">ISBN:</label>
        <input type="text" id="isbn" th:field="*{isbn}" required>
        <br>
        <label for="price">Price:</label>
        <input type="number" id="price" th:field="*{price}" step="0.01" required>
        <br>
        <button type="submit">Add Book</button>
    </form>
</body>
</html>
